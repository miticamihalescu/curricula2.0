<!DOCTYPE html>
<html lang="ro" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperare Parolă — curriculAI</title>
    <meta name="description" content="Recuperează accesul la contul tău curriculAI prin resetarea parolei.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="js/api-config.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            padding: 24px;
            margin: 0;
        }

        .auth-card {
            max-width: 440px;
            width: 100%;
            background: var(--color-bg-card);
            border-radius: 32px;
            box-shadow: 0 22px 60px var(--color-shadow-lg);
            border: 1px solid var(--color-border);
            padding: 40px;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 1.7rem;
            margin: 16px 0 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ── Step indicator ── */
        .steps {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-border);
            transition: background 0.3s, transform 0.3s;
        }

        .step-dot.active {
            background: var(--color-primary);
            transform: scale(1.4);
        }

        .step-dot.done {
            background: #22c55e;
        }

        /* ── OTP input boxes ── */
        .otp-wrapper {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 8px 0 20px;
        }

        .otp-box {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--font-heading);
            border: 2px solid var(--color-border);
            border-radius: 12px;
            background: var(--color-bg);
            color: var(--color-text);
            caret-color: var(--color-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            -moz-appearance: textfield;
        }

        .otp-box::-webkit-outer-spin-button,
        .otp-box::-webkit-inner-spin-button { -webkit-appearance: none; }

        .otp-box:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.15);
        }

        .otp-box.filled {
            border-color: var(--color-primary);
            background: rgba(0, 200, 150, 0.05);
        }

        .otp-box.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            60%       { transform: translateX(6px); }
        }

        .otp-label {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            text-align: center;
            margin-bottom: 4px;
        }

        /* ── Email display badge ── */
        .email-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            margin-bottom: 20px;
        }

        .email-badge svg {
            width: 14px;
            height: 14px;
            color: var(--color-primary);
            flex-shrink: 0;
        }

        /* ── Resend link ── */
        .resend-row {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .resend-row button {
            background: none;
            border: none;
            color: var(--color-primary);
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            font-size: 0.85rem;
            font-family: inherit;
        }

        .resend-row button:hover { text-decoration: underline; }
        .resend-row button:disabled { color: var(--color-text-muted); cursor: default; text-decoration: none; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover { text-decoration: underline; }

        /* ── Step panels ── */
        .step-panel { display: none; }
        .step-panel.active { display: block; }
    </style>
</head>

<body>
    <div class="auth-card">
        <a href="index.html" class="logo">
            <img src="/logo.png" alt="curriculAI" style="width:32px;height:32px;object-fit:contain;border-radius:8px;">
            curriculAI
        </a>

        <!-- Indicatori pași -->
        <div class="steps">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
        </div>

        <div id="messageBox" class="message-box"></div>

        <!-- ═══ PAS 1: email ═══ -->
        <div class="step-panel active" id="step1">
            <h2>Ți-ai uitat parola?</h2>
            <p class="subtitle">Introdu adresa de e-mail și îți trimitem un cod de verificare de 6 cifre.</p>

            <form id="emailForm">
                <div class="form-group">
                    <label class="form-label" for="email">Adresa de e-mail</label>
                    <input type="email" id="email" class="input-field" placeholder="profesor@exemplu.ro" autocomplete="email" required autofocus>
                </div>
                <button type="submit" class="btn-primary" id="submitEmailBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,12 2,6"/>
                    </svg>
                    Trimite codul
                </button>
            </form>

            <a href="login.html" class="back-link">← Înapoi la autentificare</a>
        </div>

        <!-- ═══ PAS 2: cod OTP ═══ -->
        <div class="step-panel" id="step2">
            <h2>Introdu codul</h2>
            <p class="subtitle">Am trimis un cod de 6 cifre la:</p>

            <div class="email-badge" id="emailBadge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,12 2,6"/>
                </svg>
                <span id="emailDisplay"></span>
            </div>

            <form id="otpForm">
                <p class="otp-label">Introdu codul primit în email</p>
                <div class="otp-wrapper">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp0">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp1">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp2">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp3">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp4">
                    <input type="number" class="otp-box" maxlength="1" min="0" max="9" inputmode="numeric" id="otp5">
                </div>

                <button type="submit" class="btn-primary" id="submitOtpBtn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Verifică codul
                </button>
            </form>

            <div class="resend-row">
                Nu ai primit codul?
                <button id="resendBtn" disabled>Retrimite (<span id="countdown">60</span>s)</button>
            </div>

            <a href="forgot-password.html" class="back-link">← Schimbă adresa de e-mail</a>
        </div>
    </div>

    <script>
        (function () {
            const saved = localStorage.getItem('curricula-theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.documentElement.setAttribute('data-theme', 'dark');
        })();

        const getApiUrl = p => API_CONFIG.baseUrl + p;
        const messageBox  = document.getElementById('messageBox');
        const dot1 = document.getElementById('dot1');
        const dot2 = document.getElementById('dot2');

        let emailValue = '';
        let countdownTimer = null;

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = 'message-box ' + type;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
            messageBox.className = 'message-box';
        }

        // ── PAS 1: trimitere email ──
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            emailValue = document.getElementById('email').value.trim();

            const btn = document.getElementById('submitEmailBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Se trimite...';

            try {
                const res = await fetch(getApiUrl('/auth/forgot-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue })
                });
                const data = await res.json();

                if (res.ok) {
                    // Trece la pasul 2
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('emailDisplay').textContent = emailValue;
                    dot1.classList.remove('active');
                    dot1.classList.add('done');
                    dot2.classList.add('active');
                    // Focus pe primul box
                    setTimeout(() => document.getElementById('otp0').focus(), 100);
                    startCountdown();
                } else {
                    showMessage(data.error || 'A apărut o eroare.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg> Trimite codul';
                }
            } catch (err) {
                showMessage('Nu s-a putut conecta la server.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg> Trimite codul';
            }
        });

        // ── OTP boxes: navigare automată ──
        const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));
        const submitOtpBtn = document.getElementById('submitOtpBtn');

        function getOTPValue() {
            return otpBoxes.map(b => b.value).join('');
        }

        function checkOTPFull() {
            const full = getOTPValue().length === 6;
            submitOtpBtn.disabled = !full;
            return full;
        }

        otpBoxes.forEach((box, i) => {
            box.addEventListener('input', () => {
                // Permite doar o cifră
                const val = box.value.replace(/\D/g, '').slice(-1);
                box.value = val;
                box.classList.toggle('filled', val !== '');

                if (val && i < 5) otpBoxes[i + 1].focus();
                checkOTPFull();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (box.value === '' && i > 0) {
                        otpBoxes[i - 1].value = '';
                        otpBoxes[i - 1].classList.remove('filled');
                        otpBoxes[i - 1].focus();
                        checkOTPFull();
                    }
                } else if (e.key === 'ArrowLeft' && i > 0) {
                    otpBoxes[i - 1].focus();
                } else if (e.key === 'ArrowRight' && i < 5) {
                    otpBoxes[i + 1].focus();
                } else if (e.key === 'Enter' && checkOTPFull()) {
                    document.getElementById('otpForm').dispatchEvent(new Event('submit'));
                }
            });

            // Paste pe orice box: distribuie cifrele
            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                pasted.split('').forEach((ch, j) => {
                    if (otpBoxes[j]) {
                        otpBoxes[j].value = ch;
                        otpBoxes[j].classList.add('filled');
                    }
                });
                const focusIdx = Math.min(pasted.length, 5);
                otpBoxes[focusIdx].focus();
                checkOTPFull();
            });
        });

        // ── PAS 2: verificare cod ──
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const cod = getOTPValue();
            if (cod.length !== 6) return;

            submitOtpBtn.disabled = true;
            submitOtpBtn.innerHTML = '<span class="spinner"></span> Se verifică...';
            otpBoxes.forEach(b => b.classList.remove('error'));

            try {
                const res = await fetch(getApiUrl('/auth/verifica-cod-reset'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue, cod })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    showMessage('✅ Cod corect! Te redirecționăm...', 'success');
                    setTimeout(() => {
                        window.location.href = `reset-password.html?token=${data.token}`;
                    }, 800);
                } else {
                    showMessage(data.error || 'Cod incorect. Încearcă din nou.', 'error');
                    otpBoxes.forEach(b => b.classList.add('error'));
                    setTimeout(() => otpBoxes.forEach(b => b.classList.remove('error')), 600);
                    otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
                    otpBoxes[0].focus();
                    submitOtpBtn.disabled = false;
                    submitOtpBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Verifică codul';
                }
            } catch (err) {
                showMessage('Nu s-a putut conecta la server.', 'error');
                submitOtpBtn.disabled = false;
                submitOtpBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px;"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Verifică codul';
            }
        });

        // ── Countdown + Retrimite ──
        function startCountdown() {
            let secs = 60;
            const resendBtn = document.getElementById('resendBtn');
            const countEl = document.getElementById('countdown');
            resendBtn.disabled = true;
            countEl.textContent = secs;

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                secs--;
                countEl.textContent = secs;
                if (secs <= 0) {
                    clearInterval(countdownTimer);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Retrimite codul';
                }
            }, 1000);
        }

        document.getElementById('resendBtn').addEventListener('click', async () => {
            hideMessage();
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;
            btn.textContent = 'Se trimite...';

            try {
                const res = await fetch(getApiUrl('/auth/forgot-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue })
                });
                if (res.ok) {
                    showMessage('Am retrimis codul. Verifică emailul.', 'success');
                    otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
                    otpBoxes[0].focus();
                    submitOtpBtn.disabled = true;
                    startCountdown();
                } else {
                    showMessage('Nu am putut retrimite codul. Încearcă din nou.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Retrimite codul';
                }
            } catch {
                showMessage('Eroare de conexiune.', 'error');
                btn.disabled = false;
                btn.textContent = 'Retrimite codul';
            }
        });
    </script>
</body>

</html>
